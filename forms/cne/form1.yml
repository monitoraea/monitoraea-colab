fields:

- key: logo_arquivo
  block: main
  type: thumbnail
  title: Logotipo
  db_field: logo_arquivo
  size: 2

- key: nome
  block: main
  type: text
  title: Nome da estrutura
  size: 12
  client_validation: not_empty # not implemented yet
  validation:
    - type: not_empty

- key: tipologia
  block: main
  type: options
  title: Como a estrutura se reconhece / identifica?
  size: 4
  # helpbox: no
  # helpbox:
    # file: https://pppzcm-files.s3.us-east-2.amazonaws.com/Centros.Nucelos.e.Equipamentos.de.Educacao.e.Cooperacao.Socioambiental.pdf
  options:
    - value: -1
      label: Não respondido
    - value: 0
      label: 'Centro de Educação Ambiental'
    - value: 1
      label: 'Núcleo de Educação Ambiental'
    - value: 2
      label: 'Equipamento de Educação Ambiental'
    - value: 3
      label: 'Outro'
  validation:
    - type: neq
      value: -1
    - type: not_empty

- key: tipologia_outro
  block: main
  type: text
  title: Especificar
  size: 4
  show:
    target:
      key: tipologia
      value: 3

- key: uf
  block: main
  type: options
  title: Estado (Sede da estrutura)
  size: 4
  remote: uf/all
  query: empty=1
  onchange:
    - key: municipio
      value:

- key: municipio
  block: main
  type: async_autocomplete
  title: Município (Sede da estrutura)
  size: 4
  remote_list: municipio/related
  remote_single: municipio/single
  filter:
    - uf

- key: detalhamento_desc
  block: details
  type: textarea
  rows: 3
  title: Descrição
  size: 12

- key: detalhamento_data
  block: details
  type: monthpicker
  title: Data da versão mais atual
  size: 4

- key: detalhamento_tipo
  block: details
  type: options
  title: Tipo de documento de detalhamento
  size: 2
  onchange:
    - key: detalhamento_arquivo
      value:
    - key: detalhamento_arquivo2
      value:
  list:
    module: property
    key: tipo_arquivo

- key: detalhamento_arquivo
  block: details
  type: text
  title: Link para o detalhamento interno
  size: 6
  show:
    target:
      key: detalhamento_tipo
      value: link

- key: detalhamento_arquivo2
  block: detalhamento_tem_block
  type: file
  accept: application/pdf
  title: Arquivo de detalhamento
  db_field: detalhamento_arquivo
  size: 6
  show:
    target:
      key: detalhamento_tipo
      value: file

- key: organizacao
  block: intitutions_it
  type: real_async_autocomplete
  remote: entity
  title: Nome da Organização %index%
  size: 6

- key: nome_gestor
  block: managers_it
  type: text
  title: Nome %index%
  size: 4

- key: email_gestor
  block: managers_it
  type: text
  title: E-mail %index%
  size: 4

- key: telefone_gestor
  block: managers_it
  type: text
  title: Telefone %index%
  size: 4

- key: data_criacao
  block: inst
  type: monthpicker
  title: Data da criação da estrutura
  size: 3

- key: possui_instrumento_juridico
  block: inst
  type: options
  title: Possui instrumento jurídico de institucionalização?
  size: 3
  list:
    module: property
    key: sim_nao

- key: data_inst
  block: inst
  type: monthpicker
  title: Data da institucionalização
  size: 3
  show:
    target:
      key: possui_instrumento_juridico
      value: true

- key: cnpj
  block: inst
  type: text
  title: CNPJ do CECSA
  size: 4
  show:
    target:
      key: possui_instrumento_juridico
      value: true

- key: estrategia_desc
  block: strategy
  type: textarea
  rows: 3
  title: Descrição
  size: 12

- key: estrategia_data
  block: strategy
  type: monthpicker
  title: Data da versão mais atual
  size: 4

- key: estrategia_tipo
  block: strategy
  type: options
  title: Tipo de documento de estrategia
  size: 2
  onchange:
    - key: estrategia_arquivo
      value:
    - key: estrategia_arquivo2
      value:
  list:
    module: property
    key: tipo_arquivo

- key: estrategia_arquivo
  block: strategy
  type: text
  title: Link para o estrategia interno
  size: 6
  show:
    target:
      key: estrategia_tipo
      value: link

- key: estrategia_arquivo2
  block: estrategia_tem_block
  type: file
  accept: application/pdf
  title: Arquivo de estrategia
  db_field: estrategia_arquivo
  size: 6
  show:
    target:
      key: estrategia_tipo
      value: file

- key: resultado_tipo
  block: outcomes_it
  type: options
  list:
    module: property
    key: tipo_resultados
  title: Tipo %index%
  size: 4

- key: resultado_link
  block: outcomes_it
  type: text
  title: Link
  size: 4

- key: resultado_data
  block: outcomes_it
  type: monthpicker
  title: Data da versão mais atual
  size: 4

- key: possui_ppp
  block: dados_estrutura
  type: options
  title: Possui PPP (Projeto Político-Pedagógico)?
  size: 3
  list:
    module: property
    key: sim_nao

- key: ppp_tipo
  block: dados_estrutura
  type: options
  title: Tipo de documento de PPP
  size: 3
  show:
    target:
      key: possui_ppp
      value: true
  onchange:
    - key: ppp_arquivo
      value:
    - key: ppp_arquivo2
      value:
  list:
    module: property
    key: tipo_arquivo

- key: ppp_arquivo
  block: dados_estrutura
  type: text
  title: Link para o documento de PPP
  size: 6
  show:
    target:
      key: ppp_tipo
      value: link

- key: ppp_arquivo2
  block: dados_estrutura
  type: file
  accept: application/pdf
  title: Arquivo de PPP
  db_field: ppp_arquivo
  size: 6
  show:
    target:
      key: ppp_tipo
      value: file

- key: ppp_data
  block: dados_estrutura
  type: monthpicker
  title: Data da última revisão
  size: 3
  show:
    target:
      key: possui_ppp
      value: true

- key: possui_espaco_fisico
  block: dados_estrutura
  type: options
  title: Possui espaço físico?
  size: 3
  list:
    module: property
    key: sim_nao

- key: possui_equipe_dedicada
  block: dados_estrutura
  type: options
  title: Possui equipe dedicada?
  size: 3
  list:
    module: property
    key: sim_nao

- key: sustentacao_financeira
  block: dados_estrutura
  type: options
  title: Qual o grau de previsibilidade da sustentação financeira da estrutura?
  size: 6
  default: -1
  options:
    - value: -1
      label: Não respondido
    - value: 0
      label: 'Não possui fonte financeira definida'
    - value: 1
      label: 'Recursos ocasionais ou esporádicos'
    - value: 2
      label: 'Recursos provenientes de projetos ou ciclos recorrentes de financiamento'
    - value: 3
      label: 'Fonte institucional contínua ou orçamento permanente'

- key: escala_atuacao
  block: atuacao_estrategia
  type: options
  title: Qual a escala declarada para a realização das atividades da estrutura?
  size: 6
  default: -1
  options:
    - value: -1
      label: Não respondido
    - value: 0
      label: 'Restrita à própria unidade/equipamento'
    - value: 1
      label: 'Comunitária, distrital ou de bairro'
    - value: 2
      label: 'Municipal'
    - value: 3
      label: 'Multimunicipal ou recorte territorial específico (bacia, TI, UC, assentamento)'
    - value: 4
      label: 'Estadual ou regional'
    - value: 5
      label: 'Nacional'
    - value: 6
      label: 'Internacional'

- key: faixa_beneficiarios
  block: atuacao_estrategia
  type: options
  title: Qual a faixa de beneficiários/ano atendidos pela estrutura?
  size: 6
  default: -1
  options:
    - value: -1
      label: Não respondido
    - value: 0
      label: 'Até 50 pessoas'
    - value: 1
      label: '51–200'
    - value: 2
      label: '201–500'
    - value: 3
      label: '501–1.000'
    - value: 4
      label: '1.001–5.000'
    - value: 5
      label: '5.001–20.000'
    - value: 6
      label: 'Mais de 20.000'
    - value: 7
      label: 'Não sei estimar'

- key: tema_outros_especificar
  block: temas_atuacao
  type: text
  title: Especificar outros temas
  size: 12

blocks: # opcional

  - key: main
    title: Sobre a Iniciativa

  - key: managers
    title: Gestores responsáveis
    elements:
      - type: block
        key: managers_it

  - key: managers_it
    iterate:
      target: none
      index: default
      add: Adicionar gestor

  - key: institutions
    title: Organizações proponentes
    counter: true
    elements:
      - type: block
        key: intitutions_it

  - key: intitutions_it
    iterate:
      target: none
      index: default
      add: Adicionar organização

  - key: inst
    title: Institucional

  - key: details
    title: Detalhamento

  - key: strategy
    title: Estratégia de sustentabilidade

  - key: outcomes
    title: Resultados e Produtos gerados
    elements:
      - type: block
        key: outcomes_it

  - key: outcomes_it
    iterate:
      target: none
      index: default
      add: Adicionar resultado ou produto

  - key: dados_estrutura
    title: Dados da estrutura

  - key: atuacao_estrategia
    title: Estratégia de atuação da estrutura

  - key: objetivos_estrategicos
    title: Objetivos estratégicos da estrutura
    type: matrix
    list:
      module: property
      key: escala_objetivo
    rows:
      - key: objetivo_articulacao
        title: Articula sociedade civil, governo e demais atores para ações educadoras socioambientais
      - key: objetivo_apoio_centros
        title: Apoia o desenvolvimento de outros centros, núcleos e equipamentos
      - key: objetivo_incidencia_politicas
        title: Promove incidência em políticas públicas socioambientais, inclusive junto às CIEAs
      - key: objetivo_producao_conteudo
        title: Produz conteúdo, comunicação e educomunicação socioambiental
      - key: objetivo_disponibiliza_dados
        title: Disponibiliza informações e dados de caráter socioambiental
      - key: objetivo_mapeamento
        title: Realiza mapeamentos e diagnósticos territoriais e de governança
      - key: objetivo_monitoramento
        title: Monitora a gestão da estratégia de educação e cooperação socioambiental
      - key: objetivo_formacao
        title: Promove processos formativos (gestores, conselheiros, agentes socioambientais)
      - key: objetivo_reflexao_critica
        title: Incentiva processos de reflexão crítica sobre a problemática socioambiental
      - key: objetivo_atividades_interpretativas
        title: Desenvolve atividades interpretativas e de contato com natureza/cultura local
      - key: objetivo_espaco_demonstrativo
        title: Atua como espaço demonstrativo e experimental de tecnologias sustentáveis
      - key: objetivo_capacitacao_renda
        title: Promove capacitação para geração de trabalho e renda com sustentabilidade
      - key: objetivo_apoio_projetos_ea
        title: Apoia elaboração e implementação de projetos, ações e eventos de EA
      - key: objetivo_apoio_programas_mma
        title: Apoia programas territoriais e políticas do MMA e instituições parceiras
      - key: objetivo_pesquisa_intercambio
        title: Promove pesquisa, socialização de conhecimento e intercâmbio técnico-científico, inclusive saberes tradicionais e cooperação internacional

  - key: temas_atuacao
    title: Temas de atuação
    type: matrix
    list:
      module: property
      key: escala_tema
    description: true
    description_extension: descreva
    descriptionHideValues: [-1, 0]
    rows:
      - key: tema_mudancas_climaticas
        title: Mudanças climáticas, adaptação e enfrentamento aos riscos e impactos climáticos
      - key: tema_biodiversidade
        title: Biodiversidade e ecossistemas
      - key: tema_recursos_hidricos
        title: Recursos hídricos
      - key: tema_residuos_solidos
        title: Resíduos sólidos
      - key: tema_energia
        title: Energia e transição energética
      - key: tema_agroecologia
        title: Agroecologia e soberania alimentar
      - key: tema_saude_ambiental
        title: Saúde ambiental
      - key: tema_justica_ambiental
        title: Justiça ambiental e territorial
      - key: tema_povos_tradicionais
        title: Povos e comunidades tradicionais
      - key: tema_gestao_riscos
        title: Gestão de riscos e desastres
      - key: tema_economia_solidaria
        title: Economia solidária e socioambiental
      - key: tema_cidades_sustentaveis
        title: Cidades e territórios sustentáveis