    elements:
      - type: column
        size: 2
        key: relations_recebe_it_base
  - type: row
    block: relations_recebe_it
    elements:
      - type: row
        elements:
          - type: column
            size: 5
            key: organizacao_r
          - type: column
            size: 6
            key: iniciativa_r    
          - type: column
            size: 1
            key: remove_r  
      - type: row
        elements:
          - type: column
            size: 5
            key: tipo_relacao_r
          - type: column
            size: 3
            key: outra_relacao_r  
      - type: row
        elements:
          - type: column
            size: 12
            key: justification_r
  - type: add
    block: relations_recebe_it
    elements:
      - type: row
        elements:
          - type: column
            size: 12
            elements:
              - type: button
                title: Adicionar uma relação

- type: separator

