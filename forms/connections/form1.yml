fields:

  - key: relations_recebe_it_base
    block: relations_recebe
    type: options
    title: Sua iniciativa RECEBE apoio?
    size: 4
    list: 
      module: property
      key: sim_nao  

  - key: relations_recebe_it_base_aviso
    block: relations_recebe
    type: label
    title: <<<< somente indicados por outras iniciativas
    show:
      target:
        key: relations_recebe_it_base_outro
        value: true

  - key: organizacao_r
    block: relations_recebe_it
    type: real_async_autocomplete
    remote: entity 
    filter:  # global
      - my_entity_type
      - my_entity_id 
    title: Nome da Organização
    size: 6 
    onchange:
      - key: iniciativa
        value:

  - key: iniciativa_r
    block: relations_recebe_it
    type: real_async_autocomplete
    remote: entity/initiatives    
    remote_single: entity 
    filter_local: 
      - organizacao_r # local
      - ^my_entity_type # global
      - ^my_entity_id  # global
    title: Nome da Iniciativa
    size: 6

  - key: tipo_relacao_r
    block: relations_recebe_it
    type: async_autocomplete
    remote_list: entity/relations_options
    title: Tipo de relação
    size: 3

  - key: outra_relacao_r
    block: relations_recebe_it
    type: text
    title: Outra relação
    size: 4
    show:
      target:
        context: local
        key: tipo_relacao_r
        value: -1

  - key: remove_r
    block: relations_recebe_it
    type: remove_iterative
    hide:
      target:
        type: hide
        context: local
        key: mine_r
        value: false

  - key: checkedByOther_r
    block: relations_recebe_it
    title_not_confirmed: Confirmar relação indicada por outra iniciativa?
    title_confirmed: Desmarcar confirmação relação indicada por outra iniciativa?
    type: confirm
    show:
      target:
        context: local
        key: mine_r
        value: false

  ####

  - key: relations_oferece_it_base
    block: relations_oferece
    type: options
    title: Sua iniciativa OFERECE apoio?
    size: 4
    list: 
      module: property
      key: sim_nao

  - key: relations_oferece_it_base_aviso
    block: relations_oferece
    type: label
    title: <<<< somente indicados por outras iniciativas
    show:
      target:
        key: relations_oferece_it_base_outro
        value: true

  - key: organizacao_o
    block: relations_oferece_it
    type: real_async_autocomplete
    remote: entity
    filter:  # global
      - my_entity_type
      - my_entity_id 
    title: Nome da Organização
    size: 6 
    onchange:
      - key: iniciativa
        value:

  - key: iniciativa_o
    block: relations_oferece_it
    type: real_async_autocomplete
    remote: entity/initiatives  
    remote_single: entity 
    filter_local:
      - organizacao_o
      - ^my_entity_type
      - ^my_entity_id  
    title: Nome da Iniciativa
    size: 6

  - key: tipo_relacao_o
    block: relations_oferece_it
    type: async_autocomplete
    remote_list: entity/relations_options
    title: Tipo de relação
    size: 3

  - key: outra_relacao_o
    block: relations_oferece_it
    type: text
    title: Outra relação
    size: 4
    show:
      target:
        context: local
        key: tipo_relacao_o
        value: -1

  - key: remove_o
    block: relations_oferece_it
    type: remove_iterative
    show:
      target:
        type: hide
        context: local        
        key: mine_o
        value: false

  - key: checkedByOther_o
    block: relations_oferece_it
    title_not_confirmed: Confirmar relação indicada por outra iniciativa?
    title_confirmed: Desmarcar confirmação relação indicada por outra iniciativa?
    type: confirm
    show:
      target:
        context: local
        key: mine_o
        value: false

blocks:

  - key: relations_recebe
    title: Relações onde sua iniciativa RECEBE apoio
    elements:
      - type: block
        key: relations_recebe_it

  - key: relations_recebe_it
    iterate:
      target: none
      index: default
      add: Adicionar gestor
    show:
      target:
        key: relations_recebe_it_base
        value: true    
  
  - key: relations_oferece
    title: Relações onde sua iniciativa OFERECE apoio
    elements:
      - type: block
        key: relations_oferece_it

  - key: relations_oferece_it
    iterate:
      target: none
      index: default
      add: Adicionar gestor
    show:
      target:
        key: relations_oferece_it_base
        value: true    