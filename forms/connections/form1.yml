fields:

  - key: relations_recebe_it_base
    block: relations_recebe
    type: options
    title: Sua iniciativa RECEBE apoio?
    size: 4
    list: 
      module: property
      key: sim_nao  

  - key: organizacao_r
    block: relations_recebe_it
    type: real_async_autocomplete
    remote: entity 
    filter:  # global
      - my_entity_type
      - my_entity_id 
    title: Nome da Organização
    size: 6 
    onchange:
      - key: iniciativa_r
        value:

  - key: iniciativa_r
    block: relations_recebe_it
    type: real_async_autocomplete
    remote: entity/initiatives    
    remote_single: entity 
    filter_local: 
      - organizacao_r # local
      - ^my_entity_type # global
      - ^my_entity_id  # global
    title: Nome da Iniciativa
    size: 6

  - key: tipo_relacao_r
    block: relations_recebe_it
    type: real_async_autocomplete
    remote: entity/relations_options
    title: Tipo de relação
    size: 3

  - key: outra_relacao_r
    block: relations_recebe_it
    type: text
    title: Outra relação
    size: 4
    show:
      target:
        context: local
        key: tipo_relacao_r
        value: -1

  - key: justification_r
    block: relations_recebe_it
    type: read_only
    css_class: nao_reconheco
    title: Esta relação não foi reconhecida pela iniciativa indicada, com a seguinte justificativa
    size: 4
    show:
      target:
        context: local
        key: confirmedByOther_r
        value: no

  - key: non_response_r
    block: relations_recebe_it
    type: read_only
    css_class: nao_avaliado
    title: Atenção
    size: 4
    show:
      target:
        context: local
        key: confirmedByOther_r
        value: non

  - key: remove_r
    block: relations_recebe_it
    type: remove_iterative

  ####

