fields:
  - key: 1
    block: main
    type: options
    title: A iniciativa promoveu alguma ação conjunta com outra(s) instituição(ções) ou comunidade(s)?
    options:
      - value: -1
        label: Não respondido
      - value: 0
        label: "Não"
      - value: 1
        label: "Sim"
    validation:
      - type: neq
        value: -1
      - type: not_empty

  - key: 2
    block: dependent
    type: integer
    title: Quantas ações foram realizadas conjuntamente (inserir dado numérico)?

  - key: 3
    block: dependent
    type: TextArea
    title: Comente.
    validation: not_empty
 
  - key: 4
    block: dependent
    type: file
    title: Apresente evidências.
    # validation: not_empty

  - key: 5
    block: dependent
    type: multi_autocomplete
    title: Quais tipos de ações conjuntas foram realizadas?
    options:
      - value: 0
        label: Cursos/Oficinas/Eventos
      - value: 1
        label: Campanhas educativas
      - value: 2
        label: Produção de materiais educativos
      - value: 3
        label: Projetos de captação de recursos financeiros
      - value: 4
        label: Ações de comunicação e difusão de informações
      - value: 5
        label: Produção de relatórios técnicos e/ou pesquisas científicas
      - value: 6
        label: Outros

  - key: 6
    block: dependent
    type: TextArea
    title: Especifique.
    show:
      target: # o texto só aparece se a pergunta da key 5 for Outro = 6
        key: 5
        value: 6
    validation: not_empty

  - key: 7
    block: dependent
    type: TextArea
    title: Comente.
    validation: not_empty
 
  - key: 8
    block: dependent
    type: file
    title: Apresente evidências (arquivo zip).
    # validation: not_empty

  - key: 9
    block: dependent
    type: options
    title: O projeto estabeleceu alguma parceria formal?
    options:
      - value: 0
        label: Não
      - value: 1
        label: Sim

  - key: 10
    block: dependent
    type: integer
    title: Quantas parcerias formais foram estabelecidas (inserir dado numérico)?
    show:
      target: # o texto só aparece se a pergunta da key 9 for Sim = 1
        key: 9
        value: 1
    validation: not_empty

  - key: 11
    block: dependent
    type: TextArea
    title: Comente.
    show:
      target: # o texto só aparece se a pergunta da key 9 for Sim = 1
        key: 9
        value: 1
    validation: not_empty

 
  - key: 12
    block: dependent
    type: file
    title: Apresente evidências (arquivo zip).
    show:
      target: # o texto só aparece se a pergunta da key 9 for Sim = 1
        key: 9
        value: 1
    # validation: not_empty

blocks:
  - key: main

  - key: dependent
    show:
      target:
        key: 1
        value: 1
