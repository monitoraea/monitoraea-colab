entity: person
table: people
schema: public

upload: separate
pwa: false
versioned: false
backend: generic

fields:
  # Required text
  - key: name
    column: name
    type: text
    nullable: false

  # Optional text
  - key: description
    column: description
    type: text
    nullable: true

  - key: children_count
    column: children_count
    type: integer
    nullable: true

  - key: children
    column: children
    type: array
    storage: jsonb
    nullable: true
    fields:
      - key: label
        type: text

  