entity: project
table: projects
schema: public

upload: separate
pwa: false
versioned: false
backend: generic

fields:
  - key: name
    column: name
    type: text
    nullable: false

  - key: description
    column: description
    type: text
    nullable: true

  - key: status
    column: status
    type: text
    nullable: true

  - key: start_date
    column: start_date
    type: date
    nullable: true

  - key: end_date
    column: end_date
    type: date
    nullable: true

  - key: owner_organization
    type: connection
    connection_type: ownership
    direction: to
    target_entity: organization
    cardinality: one
    nullable: true

  - key: owner_colegiado
    type: connection
    connection_type: ownership
    direction: to
    target_entity: colegiado
    cardinality: one
    nullable: true

triggers:
  on_save:
    - type: sync_column
      target_table: working_groups
      match:
        entity_type: project
        entity_id: $id
      set:
        name: $data.name
